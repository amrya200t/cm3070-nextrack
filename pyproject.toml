[project]
name = "nextrack"
version = "0.0.1"
description = "NextTrack prototype — stateless music recommendation (design-phase throwaway)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "implicit>=0.7",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "jupyterlab>=4.0",
    "matplotlib>=3.7",
    "ipywidgets>=8.1.8",
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "httpx>=0.28",
    "rapidfuzz>=3.9",
]

[project.scripts]
train = "nextrack._tasks:train"
demo = "nextrack._tasks:demo"
explore = "nextrack._tasks:explore"
evaluate = "nextrack.evaluate:main"
evaluate-full = "nextrack.evaluate_full:main"
enrich = "nextrack.enrich:main"
evaluate-enrich = "nextrack.evaluate_enrich:main"
api = "nextrack.api:main"
api-dev = "nextrack.api:dev"

[tool.pytest.ini_options]
testpaths = ["prototypes/tests"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["prototypes/nextrack"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]
