[project]
name = "nextrack"
version = "0.0.1"
description = "NextTrack prototype — stateless music recommendation (design-phase throwaway)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "implicit>=0.7",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "jupyterlab>=4.0",
    "matplotlib>=3.7",
    "ipywidgets>=8.1.8",
]

[project.scripts]
train = "nextrack._tasks:train"
demo = "nextrack._tasks:demo"
explore = "nextrack._tasks:explore"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["prototypes/nextrack"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
